[project]
name = "hopeful-bardeen"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI standard)
    "E712",   # Avoid equality comparisons to True (SQLAlchemy queries require == True)
    "E501",   # Line too long (handled by formatter / long SQL / long assertion strings)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B007",   # Loop control variable not used
    "B018",   # Useless expression in tests
    "B905",   # zip without strict=
    "F841",   # Local variable assigned but never used (test return values)
]
